databaseChangeLog:
  - changeSet:
      id: 003-add-user-id-to-participant-feedback
      author: kedar
      changes:

        - addColumn:
            tableName: participant_feedback
            columns:
              - column:
                  name: user_id
                  type: BIGINT

        - addForeignKeyConstraint:
            baseTableName: participant_feedback
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_feedback_user