databaseChangeLog:
  - include:
      file: db/changelog/001-create-participant-feedback.yaml




databaseChangeLog:
  - changeSet:
      id: 001-create-participant-feedback
      author: kedar
      changes:

        - createTable:
            tableName: participant_feedback
            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: uploaded_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: uploaded_by
                  type: VARCHAR(255)

              # ---- seeker ----
              - column:
                  name: seeker_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: seeker_email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: seeker_phone
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              # ---- provider ----
              - column:
                  name: provider_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: provider_email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: relationship_with_seeker
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: is_family_related
                  type: BOOLEAN
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: participant_feedback
            columnNames: seeker_email, provider_email
            constraintName: uk_seeker_provider